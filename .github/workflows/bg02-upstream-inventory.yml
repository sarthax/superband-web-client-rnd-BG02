name: BG02 upstream source inventory (one-time research)

on:
  push:
    branches: [research/bg02-peer-share-readback]
    paths: ['.github/workflows/bg02-upstream-inventory.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query public JieLi SDK source-file inventory (no downloads)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          from urllib.parse import urlencode
          HOST='https://gitlab.zh-jieli.com/api/v4/projects/1463/repository/tree'
          WATCH=('wallpaper','sharing','share_','rcsp','file_browse','ble_client','wallpaper_adv','picture','transfer')
          # Metadata only; capped at 4 pages per root to conserve vendor resources.
          for root in ('src','SDK'):
              total=0
              hits=[]
              status='ok'
              for page in range(1,5):
                  qs=urlencode({'path':root,'ref':'main','recursive':'true','per_page':100,'page':page})
                  req=urllib.request.Request(HOST+'?'+qs,headers={'User-Agent':'BG02-offline-source-research/1.0','Accept':'application/json'})
                  try:
                      with urllib.request.urlopen(req, timeout=12) as response:
                          items=json.loads(response.read(1500000))
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError,ValueError) as exc:
                      status=type(exc).__name__+': '+str(exc)[:100]
                      break
                  if not isinstance(items,list):
                      status='non-list-response'
                      break
                  total+=len(items)
                  for item in items:
                      path=item.get('path','')
                      if any(word in path.lower() for word in WATCH):
                          hits.append(path)
                  if len(items)<100:
                      break
              print('ROOT',root,'STATUS',status,'PATHS_INSPECTED',total,'CANDIDATES',len(hits))
              for path in hits[:65]:
                  print('  SOURCE_PATH',path)
              if total==400:
                  print('  LIMIT_REACHED: further pages not checked')
          print('No source files downloaded; metadata is from vendor SDK main branch only.')
          print('A missing match does not rule out a patched 200patch04 release.')
          PY

      - name: Inspect vendor RCSP server browse and file-transfer source
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error
          from urllib.parse import urlencode,quote
          api='https://gitlab.zh-jieli.com/api/v4/projects/1463/repository'
          root='SDK/apps/common/third_party_profile/jieli/rcsp/server/functions/'
          dirs=['browser','file_transfer','device_info']
          def fetch(url, cap=400000):
              req=urllib.request.Request(url,headers={'User-Agent':'BG02-source-audit/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=12) as rsp:
                  return rsp.read(cap)
          for target in dirs:
              folder=root+target
              print('MODULE',folder)
              paths=[]
              try:
                  for page in range(1,4):
                      qs=urlencode({'path':folder,'ref':'main','recursive':'true','per_page':100,'page':page})
                      rows=json.loads(fetch(api+'/tree?'+qs))
                      paths += [r['path'] for r in rows if r.get('type')=='blob' and r.get('path','').endswith(('.c','.h'))]
                      if len(rows)<100: break
              except Exception as ex:
                  print('  LIST_ERROR',type(ex).__name__,str(ex)[:80])
                  continue
              print('  FILE_COUNT',len(paths))
              for path in paths[:60]: print('  FILE',path)
              for path in paths[:30]:
                  try:
                      url=api+'/files/'+quote(path,safe='')+'/raw?ref=main'
                      src=fetch(url,250000).decode('utf-8','replace')
                  except Exception as ex:
                      print('  RAW_ERROR',path,type(ex).__name__,str(ex)[:75])
                      continue
                  candidates=set()
                  # Symbols only, not wholesale reproduction of vendor code.
                  patterns=[
                      r'\b(?:jl_wallpaper|wallpaper_sharing|file_browse|file_browser|rcsp_file|file_transfer|file_trans|rcsp_auth|fs_open|fopen|fread|fwrite)[A-Za-z0-9_]*\b',
                      r'\b(?:rcsp|RCSP)_[A-Za-z0-9_]*(?:file|browse|transfer)[A-Za-z0-9_]*\b',
                  ]
                  for pattern in patterns:
                      candidates.update(re.findall(pattern,src))
                  paths_found=sorted(set(re.findall(r'storage/[A-Za-z0-9_./-]{3,65}',src)))[:8]
                  if candidates or paths_found:
                      print('  SIGNAL',path,'SYMBOLS',','.join(sorted(candidates)[:20]) or 'none',
                            'STORAGE_PATHS',','.join(paths_found) or 'none')
          print('This is vendor-source triage only; no BG02 V35922 matching proof.')
          PY
