name: Validate

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install, test codecs and build client
        working-directory: src
        env:
          BASE_PATH: /superband-web-client-rnd-BG02/
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          node --test tests/ru50.test.mjs tests/device-profile.test.mjs tests/browser-etc2.test.mjs tests/fitpro-bg02-storage.test.mjs tests/video-avi.test.mjs tests/video-timeline.test.mjs tests/video-crop.test.mjs tests/picture-qol.test.mjs tests/picture-compare.test.mjs tests/jpeg-allocation.test.mjs tests/bg02-media-capabilities.test.mjs
          bun run build

      - name: Check dist output
        run: |
          set -euo pipefail
          test -f src/dist/index.html
          test -f src/dist/.nojekyll
          test -f src/dist/404.html
          grep -q '/superband-web-client-rnd-BG02/' src/dist/index.html
          ls -la src/dist/
