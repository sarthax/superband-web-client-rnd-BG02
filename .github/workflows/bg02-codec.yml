name: BG02 crop and codec checks

on:
  push:
    branches:
      - feature/bg02-browser-crop-etc2
    paths:
      - 'src/**'
      - '.github/workflows/bg02-codec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate image encoding and device profiles
        working-directory: src
        run: |
          bun install --frozen-lockfile
          node --test tests/ru50.test.mjs tests/device-profile.test.mjs tests/browser-etc2.test.mjs
      - name: Build browser manager
        working-directory: src
        run: bun run build
